name: Client CI

on:
    pull_request:
        paths:
            - "fogcms-client/**"

jobs:
    install:
        name: Install
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: fogcms-client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: fogcms-client/package-lock.json
            - run: npm ci

    format:
        name: Format
        runs-on: ubuntu-latest
        needs: install
        defaults:
            run:
                working-directory: fogcms-client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm run format:check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        needs: format
        defaults:
            run:
                working-directory: fogcms-client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm run lint

    test:
        name: Tests
        runs-on: ubuntu-latest
        needs: lint
        defaults:
            run:
                working-directory: fogcms-client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm run test -- --watch=false --browsers=ChromeHeadless

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        defaults:
            run:
                working-directory: fogcms-client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - run: npm run build -- --configuration production
