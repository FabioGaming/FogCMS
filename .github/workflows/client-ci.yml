name: Client CI

on:
  pull_request:
    paths:
      - "fogcms-client/**"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fogcms-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: fogcms-client/node_modules
          key: client-ci-${{ github.run_id }}-${{ hashFiles('fogcms-client/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: fogcms-client

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: fogcms-client/node_modules
          key: client-ci-${{ github.run_id }}-${{ hashFiles('fogcms-client/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: fogcms-client

      - name: Run format check
        run: npm run format:check
        working-directory: fogcms-client

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: fogcms-client/node_modules
          key: client-ci-${{ github.run_id }}-${{ hashFiles('fogcms-client/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: fogcms-client

      - name: Run lint
        run: npm run lint
        working-directory: fogcms-client

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: fogcms-client/node_modules
          key: client-ci-${{ github.run_id }}-${{ hashFiles('fogcms-client/package-lock.json') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        run: npm ci
        working-directory: fogcms-client

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: fogcms-client

      - name: Run tests
        run: npm run test
        working-directory: fogcms-client

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: fogcms-client/node_modules
          key: client-ci-${{ github.run_id }}-${{ hashFiles('fogcms-client/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: fogcms-client

      - name: Build production
        run: npm run build -- --configuration production
        working-directory: fogcms-client
